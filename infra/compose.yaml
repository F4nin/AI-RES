# AI RES local stack (S03). Base file is prod-safe (environment=prod); local/test overrides: compose.dev.yaml, compose.test.yaml.
# All third-party images are pinned by tag AND sha256 digest (DOC-015 §12.2). Resource limits are WORKING dev defaults (DOC-015 §9.4, OD-02).
# Manager/Worker Runtime (S11) never join the `data` network (PERSIST-023) and hold no database secret; they reach the domain only via `platform-api`.
name: ai-res

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  init: true

x-oneshot: &oneshot
  <<: *hardened
  restart: "no"

networks:
  ingress: {}                # only the reverse proxy; the single non-internal network that publishes a host port
  app:                       # API and (later) Manager/Worker runtimes; fixed subnet so the API can trust X-Forwarded-For from the proxy address only (ADR-071, WORKING)
    internal: true
    ipam: { config: [ { subnet: 172.28.20.0/24, ip_range: 172.28.20.128/25 } ] }  # dynamic addresses come from .128-.255; .2 (Caddy) is never handed out to another container
  data: { internal: true }   # PostgreSQL, Temporal, MinIO
  egress: {}                 # controlled egress (LLM Gateway, Connector Platform): no members until S15/S16/S28
  admin: { internal: true }  # Temporal UI, MinIO console: never reachable from ingress
  workflow: { internal: true }  # S11: Temporal frontend <-> Manager/Worker Runtime <-> outbox dispatcher; PostgreSQL is NOT on it
  observability: { internal: true }  # S13: Collector <-> Prometheus/Loki/Tempo/Alertmanager/Grafana; Temporal and MinIO join only to expose metrics

secrets:
  postgres_superuser_password: { file: ./secrets/runtime/postgres_superuser_password }
  temporal_db_password: { file: ./secrets/runtime/temporal_db_password }
  checkpointer_db_password: { file: ./secrets/runtime/checkpointer_db_password }
  migrator_db_password: { file: ./secrets/runtime/migrator_db_password }
  api_db_password: { file: ./secrets/runtime/api_db_password }
  outbox_db_password: { file: ./secrets/runtime/outbox_db_password }
  consumer_db_password: { file: ./secrets/runtime/consumer_db_password }
  auditor_db_password: { file: ./secrets/runtime/auditor_db_password }
  backup_db_password: { file: ./secrets/runtime/backup_db_password }
  minio_root_user: { file: ./secrets/runtime/minio_root_user }
  minio_root_password: { file: ./secrets/runtime/minio_root_password }
  cursor_hmac_key: { file: ./secrets/runtime/cursor_hmac_key }
  mfa_encryption_key: { file: ./secrets/runtime/mfa_encryption_key }
  idempotency_keyring: { file: ./secrets/runtime/idempotency_keyring }
  bootstrap_secret: { file: ./secrets/runtime/bootstrap_secret }
  postgres_tls_ca_cert: { file: ./secrets/runtime/postgres_tls_ca_cert }
  postgres_tls_server_cert: { file: ./secrets/runtime/postgres_tls_server_cert }
  postgres_tls_server_key: { file: ./secrets/runtime/postgres_tls_server_key }
  manager_signing_key: { file: ./secrets/runtime/manager_signing_key }
  service_public_keys: { file: ./secrets/runtime/service_public_keys }
  grafana_admin_password: { file: ./secrets/runtime/grafana_admin_password }

configs:
  domain_events_contract: { file: ../contracts/asyncapi/AI_RES_Domain_Events_AsyncAPI_v1.6.yaml }  # the dispatcher validates every event against it (G-99)

volumes:
  postgres_data: {}
  minio_data: {}
  prometheus_data: {}
  loki_data: {}
  tempo_data: {}
  grafana_data: {}
  alertmanager_data: {}

services:
  reverse-proxy:
    <<: *hardened
    build: { context: ./images/caddy, dockerfile: Dockerfile }
    image: ai-res/caddy:2.11.9
    user: "65532:65532"
    mem_limit: 128m
    networks:
      ingress: {}
      app: { ipv4_address: 172.28.20.2 }  # the only peer the API trusts for X-Forwarded-For
    ports:
      - { host_ip: 127.0.0.1, target: 8443, published: "8443", protocol: tcp }
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:uid=65532,gid=65532,mode=0700
      - /config:uid=65532,gid=65532,mode=0700
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8443"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      api: { condition: service_healthy }

  api:
    <<: *hardened
    build: { context: ../backend, dockerfile: Dockerfile }
    image: ai-res/api:dev
    user: "10001:10001"
    mem_limit: 512m
    networks: [app, data]
    environment:
      AI_RES_OTLP_ENDPOINT: http://otel-collector:4318  # S13: fail-open telemetry export; the Collector redacts again
      AI_RES_ENVIRONMENT: prod
      AI_RES_CURSOR_HMAC_KEY_FILE: /run/secrets/cursor_hmac_key
      AI_RES_DB_HOST: postgres
      AI_RES_DB_USER: ai_res_api  # least-privilege runtime identity; no DDL, no BYPASSRLS (DBM roles)
      AI_RES_DB_PASSWORD_FILE: /run/secrets/api_db_password
      AI_RES_DB_SSLMODE: verify-full
      AI_RES_DB_SSLROOTCERT_FILE: /run/secrets/postgres_tls_ca_cert
      AI_RES_DB_APPLICATION_NAME: ai-res-api
      AI_RES_MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key
      AI_RES_IDEMPOTENCY_KEYRING_FILE: /run/secrets/idempotency_keyring
      AI_RES_ALLOWED_ORIGINS: https://localhost:8443  # the Caddy endpoint; exact origins only, CORS stays deny-by-default
      AI_RES_TRUSTED_PROXY_CIDRS: 172.28.20.2/32  # Caddy only; with this unset every client would look like one address
    secrets: [cursor_hmac_key, api_db_password, postgres_tls_ca_cert, mfa_encryption_key, idempotency_keyring]
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    depends_on:
      migrate: { condition: service_completed_successfully }  # ordering only: the API process itself never runs migrations
    healthcheck:
      # Liveness only: S02 exposes no routes and a health endpoint needs a contract (api-and-contracts.md, G-23). Any HTTP answer = process serves.
      test: ["CMD", "python", "-c", "import urllib.request,urllib.error,sys\ntry: urllib.request.urlopen('http://127.0.0.1:8000/')\nexcept urllib.error.HTTPError: sys.exit(0)\nexcept Exception: sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-time first-administrator bootstrap (Auth v1.1 §3.3): `make bootstrap ORG=… EMAIL=… NAME=…`. Profile-gated: never started by `make up`.
  bootstrap:
    <<: *oneshot
    profiles: ["bootstrap"]
    build: { context: ../backend, dockerfile: Dockerfile }
    image: ai-res/api:dev
    user: "10001:10001"
    mem_limit: 256m
    networks: [data]
    stdin_open: true
    tty: true
    entrypoint: ["python", "-m", "ai_res.cli.bootstrap"]
    environment:
      AI_RES_ENVIRONMENT: prod
      AI_RES_DB_HOST: postgres
      AI_RES_DB_USER: ai_res_api
      AI_RES_DB_PASSWORD_FILE: /run/secrets/api_db_password
      AI_RES_DB_SSLMODE: verify-full
      AI_RES_DB_SSLROOTCERT_FILE: /run/secrets/postgres_tls_ca_cert
      AI_RES_DB_APPLICATION_NAME: ai-res-bootstrap
      AI_RES_BOOTSTRAP_SECRET_FILE: /run/secrets/bootstrap_secret
    secrets: [api_db_password, postgres_tls_ca_cert, bootstrap_secret]
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Internal Platform API (S11, ADR-088): the ONLY door through which Manager/Worker Runtime change the domain. Own listener (8001), never behind the proxy.
  platform-api:
    <<: *hardened
    build: { context: ../backend, dockerfile: Dockerfile }
    image: ai-res/api:dev
    user: "10001:10001"
    mem_limit: 256m
    networks: [app, data]
    command: ["python", "-m", "ai_res.api.serve_internal"]
    environment:
      AI_RES_OTLP_ENDPOINT: http://otel-collector:4318  # S13: fail-open telemetry export; the Collector redacts again
      AI_RES_ENVIRONMENT: prod
      AI_RES_DB_HOST: postgres
      AI_RES_DB_USER: ai_res_api
      AI_RES_DB_PASSWORD_FILE: /run/secrets/api_db_password
      AI_RES_DB_SSLMODE: verify-full
      AI_RES_DB_SSLROOTCERT_FILE: /run/secrets/postgres_tls_ca_cert
      AI_RES_DB_APPLICATION_NAME: ai-res-platform-api
      AI_RES_SERVICE_PUBLIC_KEYS_FILE: /run/secrets/service_public_keys
    secrets: [api_db_password, postgres_tls_ca_cert, service_public_keys]
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,urllib.error,sys\ntry: urllib.request.urlopen('http://127.0.0.1:8001/')\nexcept urllib.error.HTTPError: sys.exit(0)\nexcept Exception: sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Outbox dispatcher (S11, closes G-98 for the start route): claims ONLY `orchestration.operation-start`, starts Workflows in Temporal. Identity: ai_res_outbox_dispatcher.
  outbox-dispatcher:
    <<: *hardened
    build: { context: ../backend, dockerfile: Dockerfile }
    image: ai-res/api:dev
    user: "10001:10001"
    mem_limit: 256m
    networks: [data, workflow]
    command: ["python", "-m", "ai_res.cli.dispatcher"]
    environment:
      AI_RES_OTLP_ENDPOINT: http://otel-collector:4318  # S13: fail-open telemetry export; the Collector redacts again
      AI_RES_OTLP_GRPC_ENDPOINT: http://otel-collector:4317  # S13: Temporal SDK core metrics
      AI_RES_ENVIRONMENT: prod
      AI_RES_DB_HOST: postgres
      AI_RES_DB_USER: ai_res_outbox_dispatcher
      AI_RES_DB_PASSWORD_FILE: /run/secrets/outbox_db_password
      AI_RES_DB_SSLMODE: verify-full
      AI_RES_DB_SSLROOTCERT_FILE: /run/secrets/postgres_tls_ca_cert
      AI_RES_DB_APPLICATION_NAME: ai-res-outbox-dispatcher
      AI_RES_TEMPORAL_ADDRESS: temporal:7233
      AI_RES_ASYNCAPI_CONTRACT_FILE: /contracts/domain-events.yaml
    configs:
      - { source: domain_events_contract, target: /contracts/domain-events.yaml }
    secrets: [outbox_db_password, postgres_tls_ca_cert]
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal-namespace: { condition: service_completed_successfully }
    healthcheck:
      # Reachability of Temporal from this process' network (a poller/loop liveness signal arrives with S13 metrics, G-108).
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('temporal', 7233), 3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Manager Runtime (S11): workflow + Manager Activities on `ai-res-manager`. NO database secret, NO data network; calls platform-api with its own service token.
  manager-runtime:
    <<: *hardened
    build: { context: ../backend, dockerfile: Dockerfile }
    image: ai-res/api:dev
    user: "10001:10001"
    mem_limit: 256m
    networks: [app, workflow]
    command: ["python", "-m", "ai_res.runtime.manager"]
    environment:
      AI_RES_OTLP_ENDPOINT: http://otel-collector:4318  # S13: fail-open telemetry export; the Collector redacts again
      AI_RES_OTLP_GRPC_ENDPOINT: http://otel-collector:4317  # S13: Temporal SDK core metrics
      AI_RES_ENVIRONMENT: prod
      AI_RES_TEMPORAL_ADDRESS: temporal:7233
      AI_RES_PLATFORM_API_URL: http://platform-api:8001
      AI_RES_SERVICE_SIGNING_KEY_FILE: /run/secrets/manager_signing_key
    secrets: [manager_signing_key]
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    depends_on:
      temporal-namespace: { condition: service_completed_successfully }
      platform-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('temporal', 7233), 3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Worker Runtime (S11): registers on `ai-res-workers` only; WorkerRun execution does not exist before S23. No secrets at all.
  worker-runtime:
    <<: *hardened
    build: { context: ../backend, dockerfile: Dockerfile }
    image: ai-res/api:dev
    user: "10001:10001"
    mem_limit: 256m
    networks: [workflow]
    command: ["python", "-m", "ai_res.runtime.worker"]
    environment:
      AI_RES_OTLP_ENDPOINT: http://otel-collector:4318  # S13: fail-open telemetry export; the Collector redacts again
      AI_RES_OTLP_GRPC_ENDPOINT: http://otel-collector:4317  # S13: Temporal SDK core metrics
      AI_RES_ENVIRONMENT: prod
      AI_RES_TEMPORAL_ADDRESS: temporal:7233
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    depends_on:
      temporal-namespace: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('temporal', 7233), 3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    <<: *hardened
    image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
    user: "999:999"
    mem_limit: 1g
    networks: [data]
    entrypoint: ["/bin/bash", "/docker-config/entrypoint.sh"]
    secrets: [postgres_superuser_password, postgres_tls_server_cert, postgres_tls_server_key]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/entrypoint.sh:/docker-config/entrypoint.sh:ro
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=0700
      - /run/pgtls:uid=999,gid=999,mode=0700
      - /tmp:uid=999,gid=999,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-provision:
    <<: *oneshot
    image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
    user: "999:999"
    mem_limit: 128m
    networks: [data]
    entrypoint: ["/bin/bash", "/provision/provision.sh"]
    environment:
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres_tls_ca_cert
    secrets:
      - postgres_superuser_password
      - temporal_db_password
      - checkpointer_db_password
      - migrator_db_password
      - api_db_password
      - outbox_db_password
      - consumer_db_password
      - auditor_db_password
      - backup_db_password
      - postgres_tls_ca_cert
    volumes:
      - ./config/postgres/provision.sh:/provision/provision.sh:ro
      - ./config/postgres/provision_roles.sql:/provision/provision_roles.sql:ro
    tmpfs:
      - /tmp:uid=999,gid=999,mode=0700
    depends_on:
      postgres: { condition: service_healthy }

  # One-shot migration job (S04, Blueprint §4.1/§10): the ONLY place that runs `alembic upgrade head`; API startup never migrates.
  # Runs as ai_res_migrator over TLS verify-full, then SET ROLE ai_res_owner. Timeouts are WORKING migration-profile values (ADR-047).
  migrate:
    <<: *oneshot
    build: { context: ../backend, dockerfile: Dockerfile }
    image: ai-res/api:dev
    user: "10001:10001"
    mem_limit: 256m
    networks: [data]
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment:
      AI_RES_ENVIRONMENT: prod
      AI_RES_DB_HOST: postgres
      AI_RES_DB_USER: ai_res_migrator
      AI_RES_DB_PASSWORD_FILE: /run/secrets/migrator_db_password
      AI_RES_DB_SSLMODE: verify-full
      AI_RES_DB_SSLROOTCERT_FILE: /run/secrets/postgres_tls_ca_cert
      AI_RES_DB_APPLICATION_NAME: ai-res-migrate
      AI_RES_DB_STATEMENT_TIMEOUT_MS: "60000"
      AI_RES_DB_LOCK_TIMEOUT_MS: "5000"
      AI_RES_DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "60000"
    secrets: [migrator_db_password, postgres_tls_ca_cert]
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    depends_on:
      postgres-provision: { condition: service_completed_successfully }

  temporal-schema:
    <<: *oneshot
    image: temporalio/admin-tools:1.29.7-tctl-1.18.4-cli-1.7.2@sha256:4a17b5be706c56a9238fb7b5b32a36966cee14939658b20597837b2443b277c8
    user: "1000:1000"
    mem_limit: 256m
    networks: [data]
    entrypoint: ["/bin/sh", "/schema/setup-schema.sh"]
    secrets: [temporal_db_password, postgres_tls_ca_cert]
    volumes:
      - ./config/temporal/setup-schema.sh:/schema/setup-schema.sh:ro
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    depends_on:
      postgres-provision: { condition: service_completed_successfully }

  temporal:
    <<: *hardened
    image: temporalio/server:1.29.7@sha256:688da708d0daca6ff8083334a4a7fbbdbc7e70d1cca8e2eda8c05b21fdbd601e
    user: "1000:1000"
    mem_limit: 1g
    networks: [data, admin, workflow, observability]
    entrypoint: ["/bin/sh", "/temporal/start.sh"]
    environment:
      PROMETHEUS_ENDPOINT: 0.0.0.0:9090  # S13: server metrics for Prometheus (observability network only)
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_SEEDS: postgres
      DBNAME: temporal_db
      VISIBILITY_DBNAME: temporal_visibility_db
      POSTGRES_PWD_FILE: /run/secrets/temporal_db_password
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig/dynamic.yaml
      SQL_TLS_ENABLED: "true"
      SQL_CA: /run/secrets/postgres_tls_ca_cert
      SQL_HOST_VERIFICATION: "true"
      SQL_HOST_NAME: postgres
    secrets: [temporal_db_password, postgres_tls_ca_cert]
    volumes:
      - ./config/temporal/start.sh:/temporal/start.sh:ro
      - ./config/temporal/dynamic.yaml:/etc/temporal/dynamicconfig/dynamic.yaml:ro
    tmpfs:
      - /run/temporal:uid=1000,gid=1000,mode=0700
      - /tmp:uid=1000,gid=1000,mode=0700
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      temporal-schema: { condition: service_completed_successfully }

  temporal-namespace:
    <<: *oneshot
    image: temporalio/admin-tools:1.29.7-tctl-1.18.4-cli-1.7.2@sha256:4a17b5be706c56a9238fb7b5b32a36966cee14939658b20597837b2443b277c8
    user: "1000:1000"
    mem_limit: 128m
    networks: [admin]
    entrypoint: ["/bin/sh", "/ns/namespace.sh"]
    volumes:
      - ./config/temporal/namespace.sh:/ns/namespace.sh:ro
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    depends_on:
      temporal: { condition: service_healthy }

  temporal-ui:
    <<: *hardened
    image: temporalio/ui:2.49.1@sha256:a066bdf5c4de689cabaf80cc357871f1db5e6d750a6bcfc42e877b913e31ef24
    user: "1000:1000"
    mem_limit: 256m
    networks: [admin]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: ai-res
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      temporal: { condition: service_healthy }

  minio:
    <<: *hardened
    build: { context: ./images/minio, dockerfile: Dockerfile, target: minio }
    image: ai-res/minio:RELEASE.2025-10-15T17-29-55Z
    user: "10002:10002"
    mem_limit: 512m
    networks: [data, admin, observability]
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_PROMETHEUS_AUTH_TYPE: public  # S13: /minio/v2/metrics/cluster without a token; reachable from every network MinIO is on (data, admin, observability): accepted exposure, G-123
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_BROWSER_REDIRECT_URL: ""
    secrets: [minio_root_user, minio_root_password]
    volumes:
      - minio_data:/data
    tmpfs:
      - /tmp:uid=10002,gid=10002,mode=0700
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q '^HTTP/1\\.[01] 200'"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    <<: *oneshot
    build: { context: ./images/minio, dockerfile: Dockerfile, target: mc }
    image: ai-res/minio-mc:RELEASE.2025-08-13T08-35-41Z
    user: "10002:10002"
    mem_limit: 128m
    networks: [data]
    entrypoint: ["/bin/bash", "/init/init.sh"]
    secrets: [minio_root_user, minio_root_password]
    volumes:
      - ./config/minio/init.sh:/init/init.sh:ro
    tmpfs:
      - /tmp:uid=10002,gid=10002,mode=0700
    depends_on:
      minio: { condition: service_healthy }

  # ---- S13 observability stack (DOC-024; ADR-025/095) ----------------------------------------------------------------------------------------------
  # Telemetry loss never stops the domain (fail-open, bounded queues); the Audit Log (PostgreSQL) does not use any of these services.
  otel-collector:
    <<: *hardened
    image: otel/opentelemetry-collector-contrib:0.116.1@sha256:d0ebf65280da2e1b1491d1b93648281afd353d4b9ea19160090303cec9a233bd
    user: "10001:10001"
    mem_limit: 384m
    networks: [app, workflow, observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel/config.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    user: "65534:65534"
    mem_limit: 512m
    networks: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=:9090  # lifecycle and admin APIs stay off (Prometheus defaults)
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    tmpfs:
      - /tmp:uid=65534,gid=65534,mode=0700
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  alertmanager:
    <<: *hardened
    image: prom/alertmanager:v0.28.0@sha256:d5155cfac40a6d9250ffc97c19db2c5e190c7bc57c6b67125c94903358f8c7d8
    user: "65534:65534"
    mem_limit: 128m
    networks: [observability]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    tmpfs:
      - /tmp:uid=65534,gid=65534,mode=0700
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  loki:
    <<: *hardened
    image: grafana/loki:3.3.2@sha256:8af2de1abbdd7aa92b27c9bcc96f0f4140c9096b507c77921ffddf1c6ad6c48f
    user: "10001:10001"
    mem_limit: 512m
    networks: [observability]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  tempo:
    <<: *hardened
    image: grafana/tempo:2.7.0@sha256:12e904cc509a8e0bd87815e0bc719b6167933bc3f2532716a85811af967780f6
    user: "10001:10001"
    mem_limit: 512m
    networks: [observability]
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # Grafana: admin network only for humans (like Temporal UI); no host port, no anonymous access, no sign-up, no outbound analytics.
  grafana:
    <<: *hardened
    image: grafana/grafana:11.4.0@sha256:d8ea37798ccc41061a62ab080f2676dda6bf7815558499f901bdb0f533a456fb
    user: "472:472"
    mem_limit: 384m
    networks: [observability, admin]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ALERTING_ENABLED: "false"             # one alert path: Prometheus rules -> Alertmanager (DOC-024 §4)
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_METRICS_ENABLED: "true"
      GF_SECURITY_DATA_SOURCE_PROXY_WHITELIST: prometheus:9090 loki:3100 tempo:3200 alertmanager:9093  # a Grafana admin cannot point a datasource at Temporal UI / MinIO console (SSRF)
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    secrets: [grafana_admin_password]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards-ai-res:ro
      - grafana_data:/var/lib/grafana
    tmpfs:
      - /tmp:uid=472,gid=472,mode=0700
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    depends_on:
      prometheus: { condition: service_healthy }
      loki: { condition: service_healthy }
      tempo: { condition: service_healthy }
      alertmanager: { condition: service_healthy }
