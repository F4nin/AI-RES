apiVersion: 1
datasources:
  - { name: Prometheus, uid: prometheus, type: prometheus, access: proxy, url: "http://prometheus:9090", isDefault: true, editable: false }
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - { name: trace_id, matcherType: label, matcherRegex: trace_id, url: "$${__value.raw}", datasourceUid: tempo }
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2: { datasourceUid: loki, filterByTraceID: true }
  - { name: Alertmanager, uid: alertmanager, type: alertmanager, access: proxy, url: "http://alertmanager:9093", editable: false, jsonData: { implementation: prometheus } }
