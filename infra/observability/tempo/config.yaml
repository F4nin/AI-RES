# S13: Tempo single-binary, local storage. `compaction.block_retention` is left at the component default (it is NOT an AI RES decision; the period is open: OD-02).
stream_over_http_enabled: true
server: { http_listen_port: 3200, grpc_listen_port: 9095, log_level: warn }
distributor:
  receivers:
    otlp: { protocols: { grpc: { endpoint: 0.0.0.0:4317 } } }
ingester: { max_block_duration: 5m }
storage:
  trace:
    backend: local
    wal: { path: /var/tempo/wal }
    local: { path: /var/tempo/blocks }
usage_report: { reporting_enabled: false }
