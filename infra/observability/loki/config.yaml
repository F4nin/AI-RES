# S13: Loki single-binary, filesystem storage, OTLP ingestion (/otlp). Retention is NOT configured: the period is an owner decision (OD-02, DOC-024 §8);
# `compactor.retention_enabled` stays false, so nothing is deleted automatically (ADR-030). Disk growth is watched by the storage alerts.
auth_enabled: false
server: { http_listen_port: 3100, grpc_listen_port: 9096, log_level: warn }
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring: { kvstore: { store: inmemory } }
  storage: { filesystem: { chunks_directory: /loki/chunks, rules_directory: /loki/rules } }
schema_config:
  configs:
    - { from: "2024-04-01", store: tsdb, object_store: filesystem, schema: v13, index: { prefix: index_, period: 24h } }
limits_config:
  allow_structured_metadata: true      # required for OTLP log attributes
  reject_old_samples: true
  max_label_names_per_series: 15       # WORKING
  ingestion_rate_mb: 4                 # WORKING
  ingestion_burst_size_mb: 6           # WORKING
compactor: { working_directory: /loki/compactor, retention_enabled: false }
analytics: { reporting_enabled: false }
