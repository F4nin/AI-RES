# S03: collector skeleton. Backends (Prometheus/Loki/Tempo) arrive in S13. Never export prompts/secrets (security.md); `debug` prints counts only.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
processors:
  memory_limiter: { check_interval: 1s, limit_mib: 200 }
  batch: {}
exporters:
  debug: { verbosity: basic }
service:
  telemetry:
    metrics: { level: none }
  pipelines:
    traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
