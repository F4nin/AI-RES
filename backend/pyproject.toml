[project]
name = "ai-res-backend"
version = "0.0.0"
description = "AI RES modular monolith backend (S02: skeleton and platform primitives)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "starlette>=0.40",
  "uvicorn>=0.32",
  "uuid-utils>=0.10",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=43",
  "jsonschema>=4.24",
  "rfc3339-validator>=0.1.4",
  "referencing>=0.36",
  "pyyaml>=6",
  "temporalio>=1.20,<2",
  "httpx>=0.28.1",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2.1",
  "testcontainers[postgres]>=4.9",
  "types-jsonschema>=4.23",
  "types-pyyaml>=6",
  "schemathesis>=4.33.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_res"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["temporal: needs Docker (Testcontainers, real Temporal dev server); never replaced by the SDK time-skipping stub", "postgres: needs Docker (Testcontainers, real PostgreSQL 16); never replaced by SQLite (ADR-003)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 160
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S404", "S105", "S106", "S108"]  # fake credentials/paths in throw-away test fixtures

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["ai_res"]

[tool.importlinter]
root_package = "ai_res"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "No ORM / DB driver in API and platform layers"
type = "forbidden"
source_modules = ["ai_res.api", "ai_res.platform"]
forbidden_modules = ["sqlalchemy", "psycopg", "alembic"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "LLM provider SDKs only inside ai_res.llm.adapters"
type = "forbidden"
source_modules = ["ai_res.api", "ai_res.platform", "ai_res.modules", "ai_res.llm"]
forbidden_modules = ["openai", "anthropic", "google", "litellm", "boto3"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Platform primitives do not depend on application layers"
type = "forbidden"
source_modules = ["ai_res.platform"]
forbidden_modules = ["ai_res.api", "ai_res.modules", "ai_res.llm"]

[[tool.importlinter.contracts]]
name = "Domain modules do not import the API layer"
type = "forbidden"
source_modules = ["ai_res.modules"]
forbidden_modules = ["ai_res.api"]

[[tool.importlinter.contracts]]
name = "Persistence layer does not depend on API or domain modules"
type = "forbidden"
source_modules = ["ai_res.db"]
forbidden_modules = ["ai_res.api", "ai_res.modules", "ai_res.llm"]

[[tool.importlinter.contracts]]
name = "Policy engine does not depend on the API layer or the CLI"
type = "forbidden"
source_modules = ["ai_res.policy"]
forbidden_modules = ["ai_res.api", "ai_res.cli", "ai_res.llm"]

[[tool.importlinter.contracts]]
name = "The audit circuit does not depend on telemetry export (S13, DOC-024 §7.7)"
type = "forbidden"
source_modules = ["ai_res.modules.audit"]
forbidden_modules = ["ai_res.platform.export", "ai_res.platform.telemetry", "opentelemetry"]

[[tool.importlinter.contracts]]
name = "No application layer depends on the CLI package"
type = "forbidden"
source_modules = ["ai_res.api", "ai_res.platform", "ai_res.modules", "ai_res.db", "ai_res.policy"]
forbidden_modules = ["ai_res.cli"]

[[tool.importlinter.contracts]]
name = "Manager/Worker Runtime and orchestration hold no database, ORM, policy or domain code (S11, ADR-087)"
type = "forbidden"
source_modules = ["ai_res.runtime", "ai_res.orchestration"]
forbidden_modules = ["sqlalchemy", "psycopg", "alembic", "ai_res.db", "ai_res.policy", "ai_res.api", "ai_res.cli", "ai_res.modules"]
ignore_imports = ["ai_res.runtime.manager -> ai_res.modules.iam.service_tokens"]  # signing a service token needs no database; the module imports only platform

[[tool.importlinter.contracts]]
name = "Platform and persistence layers do not depend on the policy engine"
type = "forbidden"
source_modules = ["ai_res.platform", "ai_res.db"]
forbidden_modules = ["ai_res.policy"]
