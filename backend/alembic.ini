# Alembic configuration (S04). NO connection string and NO secret here: env.py builds the DSN from AI_RES_DB_* settings (password via file).
[alembic]
script_location = ai_res.db:migrations
# Development checkout only; the container image has no /app/src (the installed package is used via script_location).
prepend_sys_path = %(here)s/src
path_separator = os
# Revision ids are explicit; files are named <sequence>_<intent>.py (Blueprint §4.3), enforced by tests/unit/test_migration_graph.py.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
