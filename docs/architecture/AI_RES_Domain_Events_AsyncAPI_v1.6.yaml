asyncapi: 3.1.0
info:
  title: AI RES Domain Events
  version: 1.6.0
  description: CloudEvents 1.0 domain event catalogue. PostgreSQL Transactional Outbox is the MVP transport; delivery is at-least-once,
    with consumer Inbox deduplication and strict ordering only per aggregate. Canonical Operation/WorkerRun Event Model v1.4; current source map is maintained in Document Registry v4.0.
    Legacy workerRunAccepted message is deprecated; use workerRunCompleted.
defaultContentType: application/cloudevents+json
servers:
  outbox:
    host: ai_res_db.audit.outbox_events
    protocol: postgres
    description: Logical outbox transport; adapter dispatches authorized events to consumers.
