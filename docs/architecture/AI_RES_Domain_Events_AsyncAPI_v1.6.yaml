            type: string
            const: com.aires.worker_run.completed.v1
          ce_subject:
            type: string
          ce_time:
            type: string
            format: date-time
        required:
        - ce_specversion
        - ce_id
        - ce_source
        - ce_type
        - ce_subject
        - ce_time
      payload:
        type: object
        required:
        - specversion
        - id
        - source
        - type
        - subject
        - time
        - datacontenttype
        - dataschema
        - data
